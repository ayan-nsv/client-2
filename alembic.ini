[alembic]
script_location = migrations

# One version directory per product, plus the shared history every branch descends
# from. Each product's chain carries a branch label, so a release can target a single
# product:  alembic upgrade market_planner@head
#
# `migrations/versions` holds only the shared history. Subdirectories are NOT scanned
# recursively, so every product branch must be listed here. The CLI (`alembic revision`)
# builds ScriptDirectory from this line *before* env.py runs, so a DB that already has
# other branches stamped will fail with "Can't locate revision" if those dirs are
# omitted. migrate.py still rewrites this at runtime to dirs that exist on disk;
# filter_shipped_products.py trims it for subset client images.
version_locations = migrations/versions migrations/versions/core migrations/versions/market_planner migrations/versions/knowledge migrations/versions/telephone_agent

# Migrations import application packages (core, products, shared) to build metadata.
prepend_sys_path = .

# Intentionally empty: migrations/env.py fills this in from resolve_database_url() so
# Alembic and the app agree on which database they are pointing at. A value here would
# silently win over the PROD_*/POSTGRES_* precedence that config defines.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
